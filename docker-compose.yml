services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cootee-api
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      PORT: 8080
      MongoDbSettings__ConnectionString: mongodb://admin:admin123@mongodb:27017/?authSource=admin
      MongoDbSettings__DatabaseName: CoTeeDB
      AppSettings__BaseUrl: ${AppSettings__BaseUrl:-http://localhost:5001}
      AppSettings__FrontendBaseUrl: ${AppSettings__FrontendBaseUrl:-http://localhost:5173}
      AppSettings__VerificationEmailResendCooldownSeconds: ${AppSettings__VerificationEmailResendCooldownSeconds:-60}
      SmtpSettings__Host: ${SmtpSettings__Host:-smtp.gmail.com}
      SmtpSettings__Port: ${SmtpSettings__Port:-587}
      SmtpSettings__Username: ${SmtpSettings__Username:-your-email@gmail.com}
      SmtpSettings__Password: ${SmtpSettings__Password:-your-app-password}
      SmtpSettings__FromEmail: ${SmtpSettings__FromEmail:-your-email@gmail.com}
      SmtpSettings__FromName: ${SmtpSettings__FromName:-CooTee Account}
      SmtpSettings__EnableSSL: ${SmtpSettings__EnableSSL:-true}
      MomoSettings__ReturnUrl: http://localhost:5001/api/orders/momo-return
      MomoSettings__IpnUrl: http://localhost:5001/api/orders/momo-ipn
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - cootee-network
    restart: unless-stopped

  mongodb:
    image: mongo:latest
    container_name: cootee-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: CoTeeDB
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - cootee-network
    restart: unless-stopped
    healthcheck:
      test: mongosh --quiet --eval "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:latest
    container_name: cootee-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMIN_USERNAME: admin
      ME_CONFIG_MONGODB_ADMIN_PASSWORD: admin123
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@mongodb:27017/
      ME_CONFIG_BASICAUTH: 'false'
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - cootee-network
    restart: unless-stopped

volumes:
  mongodb_data:
    driver: local

networks:
  cootee-network:
    driver: bridge
